<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Lantern Ghost</title>
  <style>
    html, body { margin: 0; }
    body { font-family: monospace; text-align: center; }
    canvas { display: block; width: 320px; height: 240px; image-rendering: pixelated; margin: 0 auto; }
    #hud { width: 320px; margin: 4px auto; display: flex; justify-content: space-between; }
    #panel { position: absolute; left: 0; top: 0; width: 320px; height: 240px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
    #panel[hidden], #secondary[hidden] { display: none; }
    button { font: inherit; padding: 4px 12px; cursor: pointer; }
    .wrap { position: relative; width: 320px; margin: 0 auto; }
  </style>
</head>
<body>
  <div class="wrap">
    <canvas id="screen" width="320" height="240"></canvas>
    <div id="panel" hidden>
      <p id="panel-message"></p>
      <p id="panel-detail"></p>
      <p id="panel-highscore"></p>
      <button id="primary"></button>
      <button id="secondary" hidden></button>
    </div>
  </div>
  <div id="hud">
    <span id="timer"></span>
    <span id="candles"></span>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
